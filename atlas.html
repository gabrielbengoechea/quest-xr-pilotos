<!DOCTYPE html>
<html lang="es">
<head>

<title>Atlas Portuario XR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: globo a pantalla completa; consola de navegación flotante a la izquierda (hoja inferior en teléfono). */
  :root {
    color-scheme: dark;
    --bg: #060c13;          /* noche portuaria */
    --panel: rgba(9, 18, 28, 0.9);
    --panel-solid: #0b1622;
    --line: #1d3043;
    --ink: #e7eef4;
    --muted: #8fa2b4;
    --accent: #ffb547;      /* luz de sodio de las grúas */
    --accent-ink: #1b1204;
    --alert: #ff7a6b;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 14px; line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  canvas.stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #console {
    position: fixed; z-index: 5;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 340px; display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  header.brand { padding: 14px 16px; display: grid; gap: 8px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; margin: 0; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .lede { margin: 0; color: var(--muted); }
  button.primary, button.ghost {
    font: 600 14px/1 var(--body); border-radius: 8px; padding: 11px 14px; cursor: pointer; border: 1px solid transparent;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.primary[disabled] { background: var(--line); color: var(--muted); cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.ghost:hover { border-color: var(--accent); }
  #xrStatus { font-size: 12px; color: var(--muted); margin: 0; }

  #ficha { padding: 14px 16px; display: grid; gap: 8px; }
  #ficha h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 0; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
  #ficha .coords { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  #ficha .teu { font-family: var(--mono); font-size: 13px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  #ficha .teu b { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--accent); }
  #ficha p { margin: 0; }
  #ficha .src { font-size: 11px; color: var(--muted); }
  #ficha .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  #index { padding: 6px 0; overflow-y: auto; min-height: 0; flex: 1; }
  #index h3 { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 16px 4px; }
  .row {
    display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    width: 100%; padding: 6px 16px; background: none; border: 0; color: var(--ink); text-align: left; cursor: pointer; font: inherit;
  }
  .row:hover, .row[aria-current="true"] { background: rgba(255, 181, 71, .08); }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; }
  .row .dot.choke { border-radius: 2px; transform: rotate(45deg); width: 8px; height: 8px; margin-left: 1px; }
  .row .dot.route { border-radius: 2px; height: 4px; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--alert); }
  .note { font-size: 11px; color: var(--muted); padding: 8px 16px 10px; margin: 0; }

  #panoBar {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(680px, calc(100% - 32px)); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  #panoBar .info { flex: 1 1 260px; min-width: 0; }
  #panoBar strong { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
  #panoBar small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  #panoBar a { color: var(--accent); }

  @media (max-width: 720px) {
    #console { top: auto; right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 52%; }
    header.brand { padding: 10px 14px; }
    h1 { font-size: 24px; }
    .lede { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas class="stage" id="stage" aria-label="Globo terrestre interactivo con puertos y corredores logísticos"></canvas>

<aside id="console">
  <header class="card brand">
    <div class="eyebrow">Comercio marítimo · datos a oct. 2026</div>
    <h1>Atlas <span>Portuario</span> XR</h1>
    <p class="lede">30 puertos líderes en TEU (5 por región), 8 pasos estratégicos y 12 corredores. Elegí un nodo y entrá a verlo en 360°.</p>
    <button class="primary" id="xrButton" type="button" disabled>Comprobando WebXR…</button>
    <p id="xrStatus"></p>
  </header>
  <section class="card" id="ficha" aria-live="polite"></section>
  <nav class="card" id="index" aria-label="Índice de nodos y corredores"></nav>
</aside>

<div class="card" id="panoBar" hidden>
  <div class="info"><strong id="panoTitle"></strong><small id="panoCredit"></small></div>
  <button class="ghost" id="panoNext" type="button" hidden>Siguiente foto</button>
  <button class="primary" id="panoBack" type="button">Volver al globo</button>
</div>

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);    // alfa 0: el passthrough se ve detrás
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.xr.setFoveation(1);

const scene = new THREE.Scene();
const DESKTOP_BG = new THREE.Color(0x060c13);
scene.background = DESKTOP_BG;
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 60);
camera.position.set(0, 0.42, 1.0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 1.6, 1.4);
scene.add(sun);

/* =====================================================================
   JERARQUÍA DEL GLOBO
   anchor (punto sobre la mesa) → stand (pie) + globeRoot (escala y giro)
   globeRoot → tierra, atmósfera, retícula, marcadores, corredores
   ===================================================================== */
const anchor = new THREE.Group();
scene.add(anchor);

const darkMat = new THREE.MeshStandardMaterial({ color: 0x1c2733, metalness: 0.6, roughness: 0.4 });
const brassMat = new THREE.MeshStandardMaterial({ color: 0xc89b4a, metalness: 0.8, roughness: 0.35 });
const standBase = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.012, 40), darkMat);
standBase.position.y = 0.006;
const standStem = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.009, CONFIG.standH, 12), brassMat);
standStem.position.y = CONFIG.standH / 2;
anchor.add(standBase, standStem);
for (const m of [standBase, standStem]) { m.matrixAutoUpdate = false; m.updateMatrix(); }

const globeRoot = new THREE.Group();
globeRoot.matrixAutoUpdate = false;
anchor.add(globeRoot);

function latLonToVec(lat, lon, r, out = new THREE.Vector3()) {
  // Coincide con el mapeo UV de SphereGeometry y una textura equirectangular (u=0 → lon −180°)
  const phi = (90 - lat) * D2R, theta = (lon + 180) * D2R;
  return out.set(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}

const R = CONFIG.R;
const placeholder = new THREE.DataTexture(new Uint8Array([24, 64, 98, 255]), 1, 1);
placeholder.colorSpace = THREE.SRGBColorSpace;

const chokes = NODES.filter((n) => n.kind === 'choke');
const UP = new THREE.Vector3(0, 1, 0);

const pillarGeo = new THREE.CylinderGeometry(1, 1, 1, 10).translate(0, 0.5, 0);

NODES.forEach((node, i) => {
  node.index = i;

  node.height = node.kind === 'port' ? 0.008 + 0.06 * Math.sqrt(node.teu / 55) : 0.012;
  const base = node.normal.clone().multiplyScalar(R);
  tmpQ.setFromUnitVectors(UP, node.normal);
  if (node.kind === 'port') {
    node.mesh = portMesh; node.slot = ports.indexOf(node);

  } else {

  }

  proxyMesh.setMatrixAt(i, tmpM);

/* ---------- Corredores: tubos con flujo animado (offset de textura, sin recompilar) ---------- */
function flowTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 8;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 128, 0);
  grad.addColorStop(0, 'rgba(255,255,255,0.25)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.25)');
  grad.addColorStop(0.9, 'rgba(255,255,255,1)');
  grad.addColorStop(1, 'rgba(255,255,255,0.25)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 8);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  return t;
}
const baseFlow = flowTexture();
function slerpUnit(a, b, t, out) {
  const w = a.angleTo(b);
  if (w < 1e-6) return out.copy(a);
  const s = Math.sin(w);
  return out.copy(a).multiplyScalar(Math.sin((1 - t) * w) / s).addScaledVector(b, Math.sin(t * w) / s);
}
const corridorProxies = [];
CORRIDORS.forEach((cor, ci) => {
  const pts = [];
  const units = cor.path.map((k) => {
    if (!WP[k]) throw new Error(`Waypoint desconocido: ${k}`);
    return latLonToVec(WP[k][0], WP[k][1], 1);
  });
  for (let i = 0; i < units.length - 1; i++) {
    const a = units[i], b = units[i + 1];
    const steps = Math.max(2, Math.ceil(a.angleTo(b) / 0.03));
    for (let s = (i === 0 ? 0 : 1); s <= steps; s++) pts.push(slerpUnit(a, b, s / steps, new THREE.Vector3()).multiplyScalar(R * 1.009));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const len = curve.getLength();
  const tex = baseFlow.clone();
  tex.repeat.x = len / 0.03; // un pulso cada 3 cm de globo
  cor.material = new THREE.MeshBasicMaterial({ color: cor.color, map: tex, transparent: true, opacity: 0.9, depthWrite: false });
  cor.mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.min(800, pts.length * 3), 0.0017, 5, false), cor.material);
  cor.mesh.renderOrder = 2;
  globeRoot.add(cor.mesh);
  const proxy = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length, 0.007, 4, false), proxyMesh.material);
  proxy.visible = false;
  proxy.userData.corridor = ci;
  globeRoot.add(proxy);
  corridorProxies.push(proxy);
  cor.index = ci;
  cor.mid = curve.getPoint(0.5); // anclaje de etiqueta
});
const globePickables = [proxyMesh, ...corridorProxies];

const FONT = '"IBM Plex Sans", system-ui, sans-serif';
const FONT_D = '"Barlow Condensed", "Arial Narrow", sans-serif';
function makeCanvasMesh(w, h, worldW, transparent = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW * h / w),
    new THREE.MeshBasicMaterial({ map: tex, transparent, depthWrite: false, toneMapped: false }));
  mesh.userData.ctx = c.getContext('2d');
  mesh.userData.tex = tex;
  mesh.renderOrder = 10;
  return mesh;
}
function wrapLines(ctx, text, maxWidth) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const test = line ? `${line} ${word}` : word;
      if (line && ctx.measureText(test).width > maxWidth) { out.push(line); line = word; } else line = test;
    }
    out.push(line);
  }
  return out;
}

const label = makeCanvasMesh(512, 96, 0.16);
label.visible = false;
scene.add(label);
let labelKey = '';
function drawLabel(text, color) {
  if (labelKey === text + color) return;
  labelKey = text + color;
  const { ctx, tex } = label.userData;
  ctx.clearRect(0, 0, 512, 96);
  ctx.font = `700 46px ${FONT_D}`;
  const w = Math.min(500, ctx.measureText(text).width + 56);
  ctx.fillStyle = 'rgba(6,12,19,0.88)';
  ctx.beginPath(); ctx.roundRect((512 - w) / 2, 14, w, 68, 14); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect((512 - w) / 2 + 16, 38, 12, 20);
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  ctx.fillText(text.toUpperCase(), (512 - w) / 2 + 38, 50, w - 50);
  tex.needsUpdate = true;
}

const panelButton = makeCanvasMesh(512, 112, 0.17, false);

let panelKey = '';
function drawPanel({ eyebrow = '', title = '', meta = '', body = '', footer = '', accent = '#ffb547', button = null }) {
  const key = [eyebrow, title, meta, body, footer, accent, button].join('|');
  if (key === panelKey) return;
  panelKey = key;
  const { ctx, tex } = panel.userData;
  const W = 1024, H = 560;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(9,18,28,0.93)';
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(4, 4, W - 8, H - 8, 28); ctx.fill(); ctx.stroke();
  ctx.fillStyle = accent; ctx.fillRect(4, 40, 10, 92);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8fa2b4'; ctx.font = `500 26px ${FONT}`;
  ctx.fillText(eyebrow.toUpperCase(), 44, 58, W - 88);
  ctx.fillStyle = '#ffffff'; ctx.font = `700 64px ${FONT_D}`;
  ctx.fillText(title.toUpperCase(), 44, 122, W - 88);
  ctx.fillStyle = accent; ctx.font = `500 30px ${FONT}`;
  ctx.fillText(meta, 44, 170, W - 88);
  ctx.fillStyle = '#dbe5ee'; ctx.font = `400 29px ${FONT}`;
  wrapLines(ctx, body, W - 88).slice(0, 8).forEach((l, i) => ctx.fillText(l, 44, 224 + i * 38));
  ctx.fillStyle = '#8fa2b4'; ctx.font = `400 23px ${FONT}`;
  ctx.fillText(footer, 44, H - 30, W - 88);
  tex.needsUpdate = true;
  panelButton.visible = !!button;
  if (button) {
    const b = panelButton.userData;
    b.ctx.clearRect(0, 0, 512, 112);
    b.ctx.fillStyle = '#ffb547';
    b.ctx.beginPath(); b.ctx.roundRect(0, 0, 512, 112, 24); b.ctx.fill();
    b.ctx.fillStyle = '#1b1204'; b.ctx.font = `700 52px ${FONT_D}`;
    b.ctx.textAlign = 'center'; b.ctx.textBaseline = 'middle';
    b.ctx.fillText(button.toUpperCase(), 256, 60);
    b.ctx.textAlign = 'left';
    b.tex.needsUpdate = true;
  }
}

  table: new THREE.MeshBasicMaterial({ color: 0xffb547, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide }),
  plane: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, depthWrite: false, side: THREE.DoubleSide }),
};
const planeEntries = new Map();
let placementTargets = [];
function rebuildPlacementTargets() {
  placementTargets = [];
  for (const [plane, e] of planeEntries) if (plane.orientation === 'horizontal') placementTargets.push(e.mesh);
}
function updatePlanes(frame, refSpace) {
  const planes = frame.detectedPlanes;
  if (!planes) return;
  let changed = false;
  for (const [plane, e] of planeEntries) if (!planes.has(plane)) {
    scene.remove(e.mesh); e.mesh.geometry.dispose(); planeEntries.delete(plane); changed = true;
  }
  for (const plane of planes) {
    let e = planeEntries.get(plane);
    if (!e || e.lastChanged !== plane.lastChangedTime) {
      const geometry = new THREE.ShapeGeometry(new THREE.Shape(plane.polygon.map((p) => new THREE.Vector2(p.x, -p.z)))).rotateX(-Math.PI / 2);
      const kind = plane.semanticLabel === 'table' ? 'table' : 'plane';
      if (!e) {
        const mesh = new THREE.Mesh(geometry, planeMats[kind]);
        mesh.matrixAutoUpdate = false;
        mesh.userData.label = kind;
        scene.add(mesh);
        e = { mesh, lastChanged: plane.lastChangedTime };
        planeEntries.set(plane, e);
      } else { e.mesh.geometry.dispose(); e.mesh.geometry = geometry; e.lastChanged = plane.lastChangedTime; }
      changed = true;
    }
    const pose = frame.getPose(plane.planeSpace, refSpace);
    e.mesh.visible = !!pose && state.mode === 'placing';
    if (pose) { e.mesh.matrix.fromArray(pose.transform.matrix); e.mesh.updateMatrixWorld(true); }
  }
  if (changed) rebuildPlacementTargets();
}
function clearPlanes() {
  for (const [, e] of planeEntries) { scene.remove(e.mesh); e.mesh.geometry.dispose(); }
  planeEntries.clear();
  rebuildPlacementTargets();
}

const fmtTEU = (n) => n.toLocaleString('es-UY', { minimumFractionDigits: n < 10 ? 2 : 1, maximumFractionDigits: 2 });
function dms(value, pos, neg) {
  const a = Math.abs(value), d = Math.floor(a), m = Math.round((a - d) * 60);
  return `${d}°${String(m).padStart(2, '0')}′ ${value >= 0 ? pos : neg}`;
}
const coordText = (n) => `${dms(n.lat, 'N', 'S')} · ${dms(n.lon, 'E', 'O')}`;

function selectionTarget() {
  if (!state.selected) return null;
  return state.selected.type === 'node' ? NODES[state.selected.index] : CORRIDORS[state.selected.index];
}

function select(type, index) {
  const prev = selectionTarget();
  if (state.selected?.type === 'node') paintNode(prev, false);
  state.selected = type ? { type, index } : null;
  const sel = selectionTarget();
  if (type === 'node') paintNode(sel, true);
  for (const c of CORRIDORS) c.material.opacity = type === 'corridor' ? (c === sel ? 1 : 0.25) : 0.9;
  if (type === 'node' && !renderer.xr.isPresenting) faceNode(sel);
  state.message = '';
  refreshUI();
}

// Gira el globo para que el nodo quede de frente a la cámara (vista de escritorio)
function faceNode(node) {
  camera.getWorldPosition(tmpP);
  anchor.worldToLocal(tmpP);
  const camAngle = Math.atan2(tmpP.x - globeRoot.position.x, tmpP.z - globeRoot.position.z);
  const nodeAngle = Math.atan2(node.normal.x, node.normal.z);
  let target = camAngle - nodeAngle;
  target += Math.round((state.yawTarget - target) / (2 * Math.PI)) * 2 * Math.PI; // camino más corto
  state.yawTarget = target;
  state.autoSpin = false;
}

const stripHtml = (s) => String(s ?? '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 80);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Consulta a Commons con reintentos: ante muchas consultas seguidas, Wikimedia a veces responde vacío o con error
async function commons(params) {
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(COMMONS_API + new URLSearchParams({ format: 'json', origin: '*', ...params }), { signal: AbortSignal.timeout(12000) });
      if (res.ok) { const json = await res.json(); if (!json.error) return json; }
    } catch { /* reintenta */ }
    await sleep(700 * (attempt + 1));
  }
  throw new Error('Commons no respondió');
}

// imageinfo con miniatura: Commons devuelve miniaturas para 50 archivos por consulta como máximo
const IMAGEINFO = { prop: 'imageinfo', iiprop: 'url|size|mime|extmetadata', iiurlwidth: '3840', iiextmetadatafilter: 'Artist|LicenseShortName' };
function toItems(json) {
  const items = [];
  const pages = Object.values(json.query?.pages ?? {}).sort((a, b) => (a.index ?? 0) - (b.index ?? 0));
  for (const p of pages) {
    const ii = p.imageinfo?.[0];
    if (!ii || ii.mime !== 'image/jpeg' || !ii.width || !ii.height) continue;
    const meta = ii.extmetadata ?? {};
    items.push({
      title: p.title.replace(/^File:/, '').replace(/\.[a-z]+$/i, ''),
      width: ii.width, height: ii.height, url: ii.thumburl ?? ii.url, page: ii.descriptionurl,
      artist: stripHtml(meta.Artist?.value) || 'Autor desconocido', license: stripHtml(meta.LicenseShortName?.value) || 'ver licencia',
    });
  }
  return items;
}

async function fetchImagery(node) {
  if (imageryCache.has(node.id)) return imageryCache.get(node.id);
  const [lat, lon] = node.view ?? [node.lat, node.lon];
  const [panoJson, photoJson] = await Promise.all([
    // 360° reales: archivos con la plantilla {{Pano360}} a menos de 20 km (muchos son de nivel de calle, como Street View)
    commons({ action: 'query', generator: 'search', gsrnamespace: '6', gsrlimit: '24',
      gsrsearch: `hastemplate:Pano360 nearcoord:20km,${lat},${lon}`, ...IMAGEINFO }),
    // Fotos comunes geolocalizadas a menos de 10 km
    commons({ action: 'query', generator: 'geosearch', ggscoord: `${lat}|${lon}`, ggsradius: '10000',
      ggslimit: '50', ggsnamespace: '6', ...IMAGEINFO }),
  ]);
  const ratio = (i) => i.width / i.height;
  const panos = toItems(panoJson).filter((i) => Math.abs(ratio(i) - 2) < 0.05 && i.width >= 3000).slice(0, 10);
  const photos = toItems(photoJson).filter((i) => ratio(i) >= 1.2 && ratio(i) <= 1.95 && i.width >= 1600)
    .sort((a, b) => b.width - a.width).slice(0, 10)
    .map((i) => ({ ...i, url: i.url.replace(/\/\d+px-/, '/1920px-') }));
  const result = { panos, photos };
  imageryCache.set(node.id, result);
  return result;
}

// Street View de Google Maps en las coordenadas del nodo (se abre fuera de la app)
const streetViewUrl = (n) => {
  const [lat, lon] = n.view ?? [n.lat, n.lon];
  return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`;
};

const panoCenter = new THREE.Vector3();
const savedView = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
const loader = new THREE.TextureLoader();

async function enterNode(node) {
  if (state.loading || state.mode === 'pano') return;
  state.loading = true; state.message = ''; refreshUI();
  let imagery;
  try { imagery = await fetchImagery(node); }
  catch {
    state.loading = false;
    state.message = 'No se pudo consultar Wikimedia Commons. Las imágenes 360° necesitan conexión y la versión alojada de la app (en esta vista previa el acceso externo está bloqueado).';
    refreshUI();
    return;
  }
  const kind = imagery.panos.length ? 'pano' : (imagery.photos.length ? 'gallery' : null);
  if (!kind) {
    state.loading = false;
    state.message = 'No hay fotos libres en Wikimedia Commons cerca de este punto. Probá con Street View de Google Maps.';
    refreshUI();
    return;
  }
  const items = kind === 'pano' ? imagery.panos : imagery.photos;
  let texture;
  try { texture = await loader.loadAsync(items[0].url); }
  catch {
    state.loading = false;
    state.message = 'La imagen no se pudo descargar. Probá de nuevo en unos segundos.';
    refreshUI();
    return;
  }
  texture.colorSpace = THREE.SRGBColorSpace;
  state.loading = false;
  openPano(node, kind, items, texture);
}

function viewerPose(outPos, outDir) {
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldPosition(outPos);
  cam.getWorldDirection(outDir);
  outDir.y = 0;
  if (outDir.lengthSq() < 1e-6) outDir.set(0, 0, -1);
  outDir.normalize();
}

function openPano(node, kind, items, texture) {
  const xr = renderer.xr.isPresenting;
  const dir = new THREE.Vector3();
  if (xr) viewerPose(panoCenter, dir);
  else {
    savedView.pos.copy(camera.position); savedView.target.copy(orbit.target);
    panoCenter.set(0, 1.6, 0); dir.set(0, 0, -1);
  }
  const room = new THREE.Group();
  room.position.copy(panoCenter);
  if (kind === 'pano') {
    const geo = new THREE.SphereGeometry(25, 64, 32);
    geo.scale(-1, 1, 1); // vista desde adentro, sin espejar la imagen
    const sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: texture, toneMapped: false }));
    sphere.rotation.y = Math.atan2(dir.z, -dir.x); // centro de la foto hacia adelante
    room.add(sphere);
    room.userData.sphere = sphere;
  } else {
    room.add(new THREE.Mesh(new THREE.SphereGeometry(25, 32, 16),
      new THREE.MeshBasicMaterial({ color: 0x060c13, side: THREE.BackSide })));
    const photo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: texture, toneMapped: false }));
    photo.position.copy(dir).multiplyScalar(2.2);
    room.add(photo);
    room.userData.photo = photo;
    fitPhoto(photo, texture);
  }
  scene.add(room);
  room.updateMatrixWorld(true);
  room.userData.photo?.lookAt(panoCenter); // lookAt usa coordenadas de mundo
  state.pano = { node, kind, items, i: 0, room, texture };
  state.mode = 'pano';
  anchor.visible = false;
  label.visible = false;
  if (xr) {
    panel.position.copy(panoCenter).addScaledVector(dir, 1.3);
    panel.position.y -= 0.35;
    panel.lookAt(panoCenter);
    scene.background = new THREE.Color(0x060c13);
  } else {
    orbit.target.copy(panoCenter);
    camera.position.copy(panoCenter).addScaledVector(dir, -0.01);
    orbit.enableZoom = false; orbit.enablePan = false; orbit.rotateSpeed = -0.4; orbit.minDistance = 0.001;
    orbit.update();
  }
  pulse(state.activeController?.userData.inputSource, 0.6, 60);
  syncPanoBar();
  refreshUI();
}

function fitPhoto(photo, texture) {
  const img = texture.image;
  const aspect = img?.width && img?.height ? img.width / img.height : 1.5;
  photo.scale.set(2.4, 2.4 / aspect, 1);
}

async function nextPhoto() {
  const p = state.pano;
  if (!p || p.items.length < 2 || state.loading) return;
  state.loading = true;
  syncPanoBar();
  const i = (p.i + 1) % p.items.length;
  try {
    const tex = await loader.loadAsync(p.items[i].url);
    tex.colorSpace = THREE.SRGBColorSpace;
    if (state.pano !== p) { tex.dispose(); return; }
    p.texture.dispose();
    p.texture = tex; p.i = i;
    if (p.kind === 'pano') p.room.userData.sphere.material.map = tex; // mismo slot: no recompila
    else { p.room.userData.photo.material.map = tex; fitPhoto(p.room.userData.photo, tex); }
    pulse(state.activeController?.userData.inputSource, 0.3, 30);
  } catch { /* se queda en la imagen actual */ }
  finally { state.loading = false; syncPanoBar(); refreshUI(); }
}

function exitPano() {
  const p = state.pano;
  if (!p) return;
  p.texture.dispose();
  p.room.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  scene.remove(p.room);
  state.pano = null;
  state.mode = 'globe';
  anchor.visible = true;
  if (renderer.xr.isPresenting) scene.background = state.xrMode === 'immersive-ar' ? null : VR_BG;
  else {
    camera.position.copy(savedView.pos); orbit.target.copy(savedView.target);
    orbit.enableZoom = true; orbit.enablePan = false; orbit.rotateSpeed = 1; orbit.minDistance = 0.35;
    orbit.update();
  }
  syncPanoBar();
  refreshUI();
}

function syncPanoBar() {
  const bar = document.getElementById('panoBar');
  const p = state.pano;
  bar.hidden = !p || renderer.xr.isPresenting;
  document.getElementById('console').hidden = !!p && !renderer.xr.isPresenting;
  if (!p) return;
  const item = p.items[p.i];
  document.getElementById('panoTitle').textContent = `${p.node.name} · ${p.kind === 'pano' ? 'vista 360°' : 'foto'} ${p.i + 1} de ${p.items.length}`;
  document.getElementById('panoCredit').innerHTML = `${item.title} — ${item.artist} · ${item.license} · <a href="${item.page}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
  const next = document.getElementById('panoNext');
  next.hidden = p.items.length < 2;
  next.disabled = state.loading;
  next.textContent = state.loading ? 'Cargando…' : (p.kind === 'pano' ? 'Siguiente 360°' : 'Siguiente foto');
}
document.getElementById('panoBack').addEventListener('click', exitPano);
document.getElementById('panoNext').addEventListener('click', nextPhoto);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.mode === 'pano') exitPano(); });

/* =====================================================================
   CONTROLES OCULUS TOUCH
   ===================================================================== */
const controllerModelFactory = new XRControllerModelFactory();
const rayGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]);
const rayMaterial = new THREE.LineBasicMaterial({ color: 0xffb547, transparent: true, opacity: 0.85 });
const controllers = [];
const raycaster = new THREE.Raycaster();
const tmpMat = new THREE.Matrix4(), tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();

function pulse(source, intensity, ms) {
  try { source?.gamepad?.hapticActuators?.[0]?.pulse?.(intensity, ms)?.catch?.(() => {}); } catch { /* sin háptica */ }
}
function setRayFromController(c) {
  c.updateMatrixWorld();
  tmpMat.identity().extractRotation(c.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
  raycaster.far = 30;
}
// Devuelve { kind: 'button'|'node'|'corridor', index, distance } o null
function pickWithRay() {
  if (panel.visible && panelButton.visible) {
    const hb = raycaster.intersectObject(panelButton, false)[0];
    if (hb) return { kind: 'button', distance: hb.distance };
  }
  if (state.mode !== 'globe' || !anchor.visible) return null;
  const hit = raycaster.intersectObjects(globePickables, false)[0];
  if (!hit) return null;
  if (hit.object === proxyMesh) return { kind: 'node', index: hit.instanceId, distance: hit.distance };
  return { kind: 'corridor', index: hit.object.userData.corridor, distance: hit.distance };
}
function activateButton() {
  if (state.mode === 'pano') exitPano();
  else if (state.selected?.type === 'node') enterNode(NODES[state.selected.index]);
}

for (let i = 0; i < 2; i++) {
  const controller = renderer.xr.getController(i);
  controller.userData = { inputSource: null, prev: [], hitTestSource: null };
  const ray = new THREE.Line(rayGeometry, rayMaterial);
  ray.scale.z = 1.5; ray.visible = false;
  controller.add(ray);
  controller.userData.ray = ray;

  controller.addEventListener('connected', (e) => {
    const src = e.data;
    controller.userData.inputSource = src;
    ray.visible = src.targetRayMode === 'tracked-pointer';
    if (src.handedness === 'right' || !state.activeController) state.activeController = controller;
    const session = renderer.xr.getSession();
    if (state.xrMode === 'immersive-ar' && session?.requestHitTestSource) {
      session.requestHitTestSource({ space: src.targetRaySpace }).then((h) => { controller.userData.hitTestSource = h; }).catch(() => {});
    }
  });
  controller.addEventListener('disconnected', () => {
    if (state.grabbedBy === controller) release();
    controller.userData.hitTestSource?.cancel();
    controller.userData.hitTestSource = null;
    controller.userData.inputSource = null;
    ray.visible = false;
    if (state.activeController === controller) state.activeController = null;
  });

  // GATILLO: colocar / pulsar botón / seleccionar / siguiente foto
  controller.addEventListener('selectstart', () => {
    state.activeController = controller;
    const src = controller.userData.inputSource;
    if (state.mode === 'placing') { placeGlobe(); pulse(src, 0.6, 60); return; }
    setRayFromController(controller);
    const hit = pickWithRay();
    if (hit?.kind === 'button') { pulse(src, 0.5, 40); activateButton(); return; }
    if (state.mode === 'pano') { nextPhoto(); return; }
    if (hit) { select(hit.kind, hit.index); pulse(src, 0.5, 40); } else select(null);
  });
  // GRIP: tomar el globo con el rayo o con el mando cerca
  controller.addEventListener('squeezestart', () => {
    if (state.mode !== 'globe' || state.grabbedBy) return;
    setRayFromController(controller);
    const hit = pickWithRay();
    globeRoot.getWorldPosition(tmpV);
    if (hit || raycaster.ray.origin.distanceTo(tmpV) < CONFIG.grabRadius * state.globeScale) {
      controller.attach(anchor);
      state.grabbedBy = controller;
      pulse(controller.userData.inputSource, 0.35, 30);
    }
  });
  controller.addEventListener('squeezeend', () => {
    if (state.grabbedBy === controller) { release(); pulse(controller.userData.inputSource, 0.15, 20); }
  });

  scene.add(controller);
  const grip = renderer.xr.getControllerGrip(i);
  grip.add(controllerModelFactory.createControllerModel(grip));
  scene.add(grip);
  controllers.push(controller);
}
function release() { scene.attach(anchor); state.grabbedBy = null; }

function enterPlacing() {
  if (state.pano) exitPano();
  if (state.grabbedBy) release();
  state.mode = 'placing';
  anchor.visible = false;
  refreshUI();
}
function placeGlobe() {
  anchor.position.copy(reticle.position);
  anchor.quaternion.identity();
  const viewer = renderer.xr.getCamera();
  viewer.getWorldPosition(tmpV);
  anchor.rotation.y = Math.atan2(tmpV.x - anchor.position.x, tmpV.z - anchor.position.z); // +Z del ancla mira al usuario
  anchor.visible = true;
  reticle.visible = false;
  state.mode = 'globe';
  for (const [, e] of planeEntries) e.mesh.visible = false;
  refreshUI();
}
function updateReticle(frame, refSpace) {
  const c = state.activeController ?? controllers.find((k) => k.userData.inputSource);
  if (!c?.userData.inputSource) { reticle.visible = false; return; }
  setRayFromController(c);
  let source = null;
  const hit = raycaster.intersectObjects(placementTargets, false)[0];
  if (hit) { reticle.position.copy(hit.point); source = hit.object.userData.label; }
  else if (frame && c.userData.hitTestSource) {
    const pose = frame.getHitTestResults(c.userData.hitTestSource)[0]?.getPose(refSpace);
    if (pose) { const p = pose.transform.position; reticle.position.set(p.x, p.y, p.z); source = 'hit-test'; }
  }
  if (!source) { reticle.position.copy(raycaster.ray.origin).addScaledVector(raycaster.ray.direction, 0.7); source = 'floating'; }
  reticle.userData.material.color.set(source === 'floating' ? 0xff7a6b : 0xffb547);
  reticle.visible = true;
  c.userData.ray.scale.z = raycaster.ray.origin.distanceTo(reticle.position);
  if (source !== state.reticleSource) { state.reticleSource = source; refreshUI(); }
}

/* Gamepad xr-standard: [0] gatillo · [1] grip · [3] click stick · [4] A/X · [5] B/Y · axes[2..3] stick */
function handleGamepads(dt) {
  for (const c of controllers) {
    const src = c.userData.inputSource, gp = src?.gamepad;
    if (!gp) continue;
    const prev = c.userData.prev;
    const pressed = (i) => !!gp.buttons[i]?.pressed;
    const just = (i) => pressed(i) && !prev[i];
    const x = gp.axes[2] ?? 0, y = gp.axes[3] ?? 0;
    if (state.mode === 'globe') {
      if (Math.abs(x) > CONFIG.deadzone) { state.yawTarget += x * 1.8 * dt; state.autoSpin = false; }
      if (Math.abs(y) > CONFIG.deadzone) state.scaleTarget = THREE.MathUtils.clamp(state.scaleTarget * (1 - y * 1.2 * dt), CONFIG.minScale, CONFIG.maxScale);
      if (just(3)) state.autoSpin = !state.autoSpin;
      if (just(4) && state.selected?.type === 'node') enterNode(NODES[state.selected.index]);
      if (just(5)) enterPlacing();
    } else if (state.mode === 'pano') {
      const sphere = state.pano?.room.userData.sphere;
      if (sphere && Math.abs(x) > CONFIG.deadzone) sphere.rotation.y -= x * 1.4 * dt;
      if (just(4)) nextPhoto();
      if (just(5)) exitPano();
    }
    for (let i = 0; i < gp.buttons.length; i++) prev[i] = pressed(i);
  }
}

// Hover: acorta los rayos y muestra la etiqueta del nodo o corredor apuntado
function updateXRHover() {
  let best = null;
  for (const c of controllers) {
    if (!c.userData.ray.visible) continue;
    if (state.mode === 'placing') continue;
    setRayFromController(c);
    const hit = pickWithRay();
    c.userData.ray.scale.z = hit ? hit.distance : 1.5;
    if (hit && hit.kind !== 'button' && (!best || hit.distance < best.distance)) best = { ...hit, controller: c };
  }
  setHover(best);
}
function setHover(hit) {
  const key = hit ? `${hit.kind}:${hit.index}` : null;
  const prevKey = state.hovered ? `${state.hovered.kind}:${state.hovered.index}` : null;
  state.hovered = hit;
  if (key !== prevKey && hit?.controller) pulse(hit.controller.userData.inputSource, 0.08, 10);
  if (!hit) { label.visible = false; return; }
  const isNode = hit.kind === 'node';
  const target = isNode ? NODES[hit.index] : CORRIDORS[hit.index];
  drawLabel(isNode && target.kind === 'port' ? `${target.name} · ${fmtTEU(target.teu)} M` : target.name,
    isNode ? REGIONS[target.region].color : target.color);
  label.position.copy(isNode ? target.top : target.mid);
  globeRoot.localToWorld(label.position);
  label.visible = state.mode === 'globe' && anchor.visible;
}

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, CONFIG.standH + R, 0);
orbit.enableDamping = true;
orbit.enablePan = false;

const pointer = new THREE.Vector2(), downAt = new THREE.Vector2();
function pointerRay(e) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
}
renderer.domElement.addEventListener('pointerdown', (e) => { downAt.set(e.clientX, e.clientY); state.autoSpin = false; });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (renderer.xr.isPresenting || state.mode !== 'globe' || e.pointerType === 'touch') return;
  pointerRay(e);

  renderer.domElement.style.cursor = state.hovered ? 'pointer' : 'grab';
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (renderer.xr.isPresenting || downAt.distanceTo(tmpV2.set(e.clientX, e.clientY)) > 6) return;
  if (state.mode === 'pano') { if (state.pano?.kind === 'gallery') nextPhoto(); return; }
  pointerRay(e);
  const hit = pickWithRay();
  if (hit && hit.kind !== 'button') select(hit.kind, hit.index); else select(null);
});

  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =====================================================================
   SESIÓN WEBXR (immersive-ar → immersive-vr → escritorio)
   ===================================================================== */
const VR_BG = new THREE.Color(0x0b1622);
const xrButton = document.getElementById('xrButton');
const xrStatus = document.getElementById('xrStatus');
let enterText = '';

async function startSession(mode) {
  const init = mode === 'immersive-ar'
    ? { requiredFeatures: ['local-floor'], optionalFeatures: ['plane-detection', 'hit-test'] }
    : { requiredFeatures: ['local-floor'] };
  try {
    const session = await navigator.xr.requestSession(mode, init);
    state.xrMode = mode;
    await renderer.xr.setSession(session);
  } catch (err) {
    state.xrMode = null;
    xrStatus.textContent = `No se pudo iniciar la sesión: ${err.message}`;
  }
}
async function setupXR() {
  if (!('xr' in navigator)) {
    xrButton.textContent = 'Sin visor: modo escritorio';
    xrStatus.textContent = 'Para entrar con el Meta Quest, abrí la versión alojada (HTTPS) desde su navegador.';
    return;
  }
  const ar = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  const vr = ar ? false : await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
  if (!ar && !vr) {
    xrButton.textContent = 'Sin visor: modo escritorio';
    xrStatus.textContent = 'Este navegador no admite sesiones inmersivas aquí.';
    return;
  }
  const mode = ar ? 'immersive-ar' : 'immersive-vr';
  xrButton.disabled = false;
  enterText = xrButton.textContent = ar ? 'Entrar en realidad mixta' : 'Entrar en VR';
  xrStatus.textContent = ar ? 'Passthrough disponible: el globo se apoya en tu mesa.' : 'Sin passthrough: el globo flotará frente a vos.';
  xrButton.addEventListener('click', () => {
    const s = renderer.xr.getSession();
    if (s) s.end(); else startSession(mode);
  });
}

renderer.xr.addEventListener('sessionstart', () => {
  const session = renderer.xr.getSession();
  const ar = state.xrMode === 'immersive-ar';
  if (state.pano) exitPano();
  scene.background = ar ? null : VR_BG;
  orbit.enabled = false;
  label.visible = false;
  xrButton.textContent = 'Salir del visor';
  if (session.supportedFrameRates?.includes(CONFIG.targetFrameRate) && session.updateTargetFrameRate) {
    session.updateTargetFrameRate(CONFIG.targetFrameRate).catch(() => {});
  }
  if (ar) enterPlacing();
  else {
    // VR: globo flotante a la altura de una mesa, 0,8 m delante
    anchor.position.set(0, 0.75, -0.8);
    anchor.rotation.set(0, 0, 0);
    anchor.visible = true;
    state.mode = 'globe';
    refreshUI();
  }
});
renderer.xr.addEventListener('sessionend', () => {
  for (const c of controllers) { c.userData.hitTestSource?.cancel(); c.userData.hitTestSource = null; }
  if (state.grabbedBy) release();
  if (state.pano) exitPano();
  clearPlanes();
  state.xrMode = null;
  state.mode = 'globe';
  scene.background = DESKTOP_BG;
  reticle.visible = false;
  panel.visible = false;
  anchor.position.set(0, 0, 0);
  anchor.quaternion.identity();
  anchor.visible = true;
  orbit.enabled = true;
  xrButton.textContent = enterText || 'Entrar de nuevo';
  refreshUI();
});

/* =====================================================================
   BUCLE DE RENDER
   setAnimationLoop usa requestAnimationFrame en escritorio y el bucle del visor en XR
   (72/90 Hz), que entrega un XRFrame como segundo argumento. Nada se crea dentro del bucle.
   ===================================================================== */
const timer = new THREE.Timer();
timer.connect(document);

function animate(timestamp, frame) {
  timer.update(timestamp);
  const dt = Math.min(timer.getDelta(), 0.05);

  if (frame) {
    const refSpace = renderer.xr.getReferenceSpace();
    updatePlanes(frame, refSpace);
    if (state.mode === 'placing') updateReticle(frame, refSpace);
    handleGamepads(dt);
    updateXRHover();
  } else {
    orbit.update(dt);
  }

  // Globo: giro y escala suavizados (solo recompone su matriz cuando cambia algo)
  if (state.autoSpin && state.mode === 'globe' && !state.hovered) state.yawTarget += CONFIG.autoSpin * dt;
  const yaw = THREE.MathUtils.damp(state.yaw, state.yawTarget, 6, dt);
  const scale = THREE.MathUtils.damp(state.globeScale, state.scaleTarget, 8, dt);
  if (Math.abs(yaw - state.yaw) > 1e-6 || Math.abs(scale - state.globeScale) > 1e-6) {
    state.yaw = yaw; state.globeScale = scale;
    updateGlobeTransform();
    if (state.hovered) setHover(state.hovered);
  }

  // Flujo de mercancías por los corredores: solo cambia un uniform por corredor
  for (const c of CORRIDORS) c.material.map.offset.x -= dt * 1.2;

  // Etiqueta flotante siempre de frente al usuario
  if (label.visible) {
    (renderer.xr.isPresenting ? renderer.xr.getCamera() : camera).getWorldPosition(tmpV);
    label.lookAt(tmpV);
  }

  // Panel del visor: sobre el globo (o la retícula) y mirando al usuario
  if (renderer.xr.isPresenting) {
    panel.visible = state.mode !== 'placing' || reticle.visible;
    if (state.mode === 'globe') {
      globeRoot.getWorldPosition(panel.position);
      panel.position.y += R * state.globeScale + 0.2;
    } else if (state.mode === 'placing') {
      panel.position.copy(reticle.position).y += 0.35;
    }
    if (state.mode !== 'pano') {
      renderer.xr.getCamera().getWorldPosition(tmpV);
      panel.lookAt(tmpV);
    }
  }

  renderer.render(scene, camera);
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
await Promise.race([document.fonts?.ready, new Promise((r) => setTimeout(r, 1500))]);
refreshUI();
try { await renderer.compileAsync(scene, camera); } catch { /* compila al vuelo */ }
renderer.setAnimationLoop(animate);
setupXR();
</script>
</body>
</html>
